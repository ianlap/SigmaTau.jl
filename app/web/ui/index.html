<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SigmaTau explorer</title>
  <link rel="stylesheet" href="theme.css">
  <link rel="stylesheet" href="app.css">
  <script src="js/theme.js"></script>
</head>
<body>
  <header class="topbar">
    <div class="brand"><span class="brand-name">SigmaTau</span><span class="brand-sub">explorer</span></div>
    <h1 class="sr-only" id="page-title"></h1>
    <nav class="tabs" aria-label="Pages">
      <div class="tab-group" role="group" aria-label="The record"><a href="#data" data-page="data">Data</a><a href="#synthesis" data-page="synthesis">Synthesis</a><a href="#live" data-page="live">Live</a></div>
      <div class="tab-group" role="group" aria-label="Analysis"><a href="#stability" data-page="stability">Stability</a><a href="#spectrum" data-page="spectrum">Spectrum</a><a href="#dynamic" data-page="dynamic">Dynamic</a></div>
      <div class="tab-group" role="group" aria-label="Clock model"><a href="#holdover" data-page="holdover">Holdover</a><a href="#steering" data-page="steering">Steering</a></div>
      <div class="tab-group" role="group" aria-label="Several clocks"><a href="#ensemble" data-page="ensemble">Ensemble</a></div>
    </nav>
    <span class="grow"></span>
    <button class="record-chip" id="record-chip" type="button" title="Show the record on the Data page">
      <span class="dot" id="record-dot" aria-hidden="true"></span><span id="record-chip-text">No record</span>
    </button>
    <div class="menu-wrap">
      <button class="btn" id="export-btn" type="button" aria-haspopup="menu" aria-expanded="false">File ▾</button>
      <div class="menu" id="export-menu" role="menu" hidden>
        <button type="button" role="menuitem" data-export="png">Plot as PNG</button>
        <button type="button" role="menuitem" data-export="svg">Plot as SVG</button>
        <button type="button" role="menuitem" data-export="tsv">Results as TSV</button>
        <button type="button" role="menuitem" data-export="json">Results as JSON</button>
        <button type="button" role="menuitem" data-export="report">Stability report (HTML, prints to PDF)</button>
        <hr>
        <button type="button" role="menuitem" data-export="save-session">Save session…</button>
        <button type="button" role="menuitem" data-export="open-session">Open session…</button>
      </div>
    </div>
    <button class="btn btn-round theme-btn" id="theme-btn" type="button">
      <svg class="i-system" viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="6" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M8 2a6 6 0 0 1 0 12z" fill="currentColor"/></svg>
      <svg class="i-light" viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="3" fill="currentColor"/><path d="M8 1v2M8 13v2M1 8h2M13 8h2M3 3l1.4 1.4M11.6 11.6 13 13M3 13l1.4-1.4M11.6 4.4 13 3" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
      <svg class="i-dark" viewBox="0 0 16 16" aria-hidden="true"><path d="M13.5 10A6 6 0 0 1 6 2.5a6 6 0 1 0 7.5 7.5z" fill="currentColor"/></svg>
    </button>
    <div class="menu-wrap">
      <button class="btn btn-round" id="help-btn" type="button" aria-label="Help" aria-haspopup="true" aria-expanded="false">?</button>
      <div class="menu help-menu" id="help-menu" hidden>
        <input type="search" id="help-search" placeholder="Search the help" aria-label="Search the help" autocomplete="off">
        <div id="help-items"></div>
      </div>
    </div>
  </header>

  <div class="body">
    <nav class="rail" id="rail" aria-label="Panels">
      <button class="rail-btn" id="rail-panel" type="button" aria-controls="side" aria-expanded="true">
        <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M3 6h14M3 14h14" stroke="currentColor" stroke-width="1.6"/><circle cx="7" cy="6" r="2" fill="var(--bg-panel)" stroke="currentColor" stroke-width="1.6"/><circle cx="13" cy="14" r="2" fill="var(--bg-panel)" stroke="currentColor" stroke-width="1.6"/></svg>
        <span>Settings</span></button>
      <button class="rail-btn" id="rail-results" type="button" aria-expanded="false" title="The results beside the plot" hidden>
        <svg viewBox="0 0 20 20" aria-hidden="true"><rect x="3" y="4" width="14" height="12" rx="2" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M3 8h14M8 8v8" stroke="currentColor" stroke-width="1.6"/></svg>
        <span>Results</span></button>
      <span class="grow"></span>
      <button class="rail-run" id="rail-run" type="button" aria-label="Run analysis">
        <svg class="i-run" viewBox="0 0 20 20" aria-hidden="true"><path d="M7 4.5l9 5.5-9 5.5z" fill="currentColor"/></svg>
        <svg class="i-stop" viewBox="0 0 20 20" aria-hidden="true"><rect x="5.5" y="5.5" width="9" height="9" rx="1.5" fill="currentColor"/></svg>
        <span class="stale-dot" aria-hidden="true" hidden></span></button>
      <span class="rail-run-label" aria-hidden="true">Run</span>
    </nav>
    <aside class="side" id="side" aria-label="Clocks, estimators and options"></aside>
    <main class="page" id="page"></main>
  </div>

  <footer class="statusbar">
    <span class="status-dot" id="status-dot" aria-hidden="true"></span>
    <span id="status-text" role="status" aria-live="polite">Starting…</span>
    <span class="status-hint" id="status-hint"></span>
  </footer>

  <dialog id="picker-dialog" class="dialog picker-dialog" aria-label="Add estimators"></dialog>
  <dialog id="import-dialog" class="dialog import-dialog" aria-label="Import a record"></dialog>

  <script type="module" src="js/main.js"></script>
</body>
</html>
