<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SigmaTau explorer</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="theme.css">
  <link rel="stylesheet" href="app.css">
  <script src="js/theme.js"></script>
</head>
<body>
  <header class="topbar">
    <div class="brand"><span class="brand-name">SigmaTau</span><span class="brand-sub">explorer</span></div>
    <nav class="tabs" aria-label="Pages">
      <a href="#data" data-page="data">Data</a>
      <a href="#synthesis" data-page="synthesis">Synthesis</a>
      <a href="#stability" data-page="stability">Stability</a>
      <a href="#spectrum" data-page="spectrum">Spectrum</a>
      <a href="#dynamic" data-page="dynamic">Dynamic</a>
      <a href="#holdover" data-page="holdover">Holdover</a>
      <a href="#ensemble" data-page="ensemble">Ensemble</a>
      <a href="#live" data-page="live">Live</a>
    </nav>
    <span class="grow"></span>
    <button class="record-chip" id="record-chip" type="button" title="Show the record on the Data page">
      <span class="dot" id="record-dot" aria-hidden="true"></span><span id="record-chip-text">No record</span>
    </button>
    <div class="menu-wrap">
      <button class="btn" id="export-btn" type="button" aria-haspopup="menu" aria-expanded="false">File ▾</button>
      <div class="menu" id="export-menu" role="menu" hidden>
        <button role="menuitem" data-export="png">Plot as PNG</button>
        <button role="menuitem" data-export="svg">Plot as SVG</button>
        <button role="menuitem" data-export="tsv">Results as TSV</button>
        <button role="menuitem" data-export="json">Results as JSON</button>
        <button role="menuitem" data-export="report">Report (HTML, prints to PDF)</button>
        <hr>
        <button role="menuitem" data-export="save-session">Save session…</button>
        <button role="menuitem" data-export="open-session">Open session…</button>
      </div>
    </div>
    <button class="btn btn-round theme-btn" id="theme-btn" type="button">
      <svg class="i-system" viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="6" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M8 2a6 6 0 0 1 0 12z" fill="currentColor"/></svg>
      <svg class="i-light" viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="3" fill="currentColor"/><path d="M8 1v2M8 13v2M1 8h2M13 8h2M3 3l1.4 1.4M11.6 11.6 13 13M3 13l1.4-1.4M11.6 4.4 13 3" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
      <svg class="i-dark" viewBox="0 0 16 16" aria-hidden="true"><path d="M13.5 10A6 6 0 0 1 6 2.5a6 6 0 1 0 7.5 7.5z" fill="currentColor"/></svg>
    </button>
    <a class="btn btn-round" id="help-btn" href="#help" aria-label="Help">?</a>
  </header>

  <div class="body">
    <aside class="side" id="side" aria-label="Clocks, estimators and options"></aside>
    <main class="page" id="page"></main>
  </div>

  <footer class="statusbar" role="status" aria-live="polite">
    <span class="status-dot" id="status-dot" aria-hidden="true"></span>
    <span id="status-text">Starting…</span>
    <span class="status-hint" id="status-hint"></span>
  </footer>

  <dialog id="picker-dialog" class="dialog picker-dialog" aria-label="Add estimators"></dialog>
  <dialog id="import-dialog" class="dialog import-dialog" aria-label="Import a record"></dialog>

  <script type="module" src="js/main.js"></script>
</body>
</html>
