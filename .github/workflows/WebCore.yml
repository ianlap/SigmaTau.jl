name: Web core

# Builds the web explorer's analysis core (app/web/cli) with juliac
# --trim=safe and checks its JSON output and serve.py's requests. A trim
# error anywhere in SigmaTau's code path fails the build step.

on:
  push:
    branches: [main, dev]
    paths:
      - 'src/**'
      - 'Project.toml'
      - 'app/web/**'
      - 'test/fixtures/validation/**'
      - '.github/workflows/WebCore.yml'
  pull_request:
    paths:
      - 'src/**'
      - 'Project.toml'
      - 'app/web/**'
      - 'test/fixtures/validation/**'
      - '.github/workflows/WebCore.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  build-and-test:
    name: trim=safe build and JSON checks
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: '1.13'
      - uses: julia-actions/cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install JuliaC
        run: |
          julia -e 'using Pkg; Pkg.Apps.add("JuliaC")'
          echo "$HOME/.julia/bin" >> "$GITHUB_PATH"

      - name: Instantiate the core's project
        run: julia --project=app/web/cli -e 'using Pkg; Pkg.instantiate(); Pkg.precompile()'

      - name: Build with --trim=safe
        run: |
          juliac --output-exe sigmatau-cli --bundle app/web/cli/build \
                 --trim=safe --experimental app/web/cli 2>&1 | tee juliac.log
          test -x app/web/cli/build/bin/sigmatau-cli
          {
            echo "### Web core"
            echo "- executable: $(du -h app/web/cli/build/bin/sigmatau-cli | cut -f1)"
            echo "- bundle: $(du -sh app/web/cli/build | cut -f1)"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Smoke run
        run: |
          app/web/cli/build/bin/sigmatau-cli --synth 8192 \
            --devs adev,mdev,tdev,hdev,mhdev,totdev --spectrum --dynamic dadev \
            | python3 -c 'import json,sys; d=json.load(sys.stdin); print("elapsed_ms", d["elapsed_ms"])'

      - name: JSON and serve.py checks
        env:
          SIGMATAU_CLI: ${{ github.workspace }}/app/web/cli/build/bin/sigmatau-cli
          SIGMATAU_PARITY: '1'
        run: python3 -m unittest discover -s app/web/cli/test -v

      - name: Upload the juliac log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: juliac-log
          path: juliac.log
          if-no-files-found: ignore
