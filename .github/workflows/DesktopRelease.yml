name: Desktop release

# Builds the desktop explorer (app/desktop) for macOS (Apple silicon and
# Intel) and Linux (.deb and AppImage), with the trimmed sigmatau core inside,
# and the sigmatau command line on its own as a .tar.gz for each. It runs
# only on a tag, or by hand (Actions > Desktop release > Run workflow), and
# takes 20 to 30 minutes, so it does not run on pull requests:
#   v0.7.0       (TagBot's release tag) adds the files to that release;
#   app-v0.1.0   makes a draft release of its own with them;
#   by hand      uploads them as workflow artifacts, listed in the run summary.
#
# macOS signing is optional. With these repository secrets the app is signed
# with a Developer ID and notarized; without them it is signed ad hoc:
#   APPLE_CERTIFICATE           base64 of the "Developer ID Application" .p12
#   APPLE_CERTIFICATE_PASSWORD  the .p12's password
#   APPLE_SIGNING_IDENTITY      e.g. "Developer ID Application: Name (TEAMID)"
#   APPLE_ID, APPLE_PASSWORD    Apple ID and an app-specific password
#   APPLE_TEAM_ID               the ten-character team ID

on:
  push:
    tags: ['v*', 'app-v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bundle:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: macOS (Apple silicon), os: macos-15 }
          - { name: macOS (Intel), os: macos-15-intel }
          - { name: Linux, os: ubuntu-22.04 }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    env:
      HAS_APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: julia-actions/setup-julia@v2
        with:
          version: '1.13'
      - uses: julia-actions/cache@v2

      - name: Build the core with --trim=safe
        run: |
          julia -e 'using Pkg; Pkg.Apps.add("JuliaC")'
          julia --project=cli -e 'using Pkg; Pkg.instantiate()'
          ~/.julia/bin/juliac --output-exe sigmatau --bundle cli/build --trim=safe --experimental cli
          cli/build/bin/sigmatau analyze --synth 4096 --devs adev > /dev/null

      - name: Linux packages for the webview
        if: runner.os == 'Linux'
        run: |
          sudo apt-get -o Acquire::Retries=3 update
          sudo apt-get -o Acquire::Retries=3 install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev \
            libayatana-appindicator3-dev patchelf file

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/desktop
      - name: Tauri CLI
        run: cargo install tauri-cli --version '^2' --locked

      - name: Plotly for offline use
        run: python3 app/web/serve.py --fetch-plotly

      - name: Import the signing certificate
        if: runner.os == 'macOS' && env.HAS_APPLE_CERTIFICATE == 'true'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          KC="$RUNNER_TEMP/signing.keychain-db"; PW=$(uuidgen)
          echo "$APPLE_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$PW" "$KC"
          security set-keychain-settings -lut 21600 "$KC"
          security unlock-keychain -p "$PW" "$KC"
          security import "$RUNNER_TEMP/cert.p12" -P "$APPLE_CERTIFICATE_PASSWORD" \
            -A -t cert -f pkcs12 -k "$KC"
          security set-key-partition-list -S apple-tool:,apple: -k "$PW" "$KC"
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')

      - name: Bundle
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: app/desktop/bundle.sh

      - name: Command-line archive
        run: |
          VERSION=$(sed -n 's/^version = "\(.*\)"/\1/p' Project.toml)
          OS=$([ "$RUNNER_OS" = macOS ] && echo macos || echo linux)
          NAME="sigmatau-$VERSION-$OS-$(uname -m)"
          cp -a cli/build "$RUNNER_TEMP/$NAME"
          tar -czf "app/desktop/dist/$NAME.tar.gz" -C "$RUNNER_TEMP" "$NAME"

      - uses: actions/upload-artifact@v4
        with:
          name: SigmaTau-Explorer-${{ matrix.os }}
          path: app/desktop/dist/*
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: bundle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      # TagBot has made (or is making) the release for a v* tag: add the files.
      - if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
      - if: startsWith(github.ref, 'refs/tags/app-v')
        uses: softprops/action-gh-release@v2
        with:
          name: SigmaTau Explorer ${{ github.ref_name }}
          files: dist/*
          draft: true

  summary:
    if: github.event_name == 'workflow_dispatch'
    needs: bundle
    runs-on: ubuntu-latest
    steps:
      - name: Where the files are
        run: |
          {
            echo "## Downloads"
            echo
            echo "Under **Artifacts** at the bottom of this page, one zip per platform:"
            echo
            echo "| Artifact | Holds |"
            echo "|---|---|"
            echo "| SigmaTau-Explorer-ubuntu-22.04 | Linux x86_64: .AppImage, .deb, sigmatau CLI .tar.gz |"
            echo "| SigmaTau-Explorer-macos-15 | macOS Apple silicon: .dmg, .zip, sigmatau CLI .tar.gz |"
            echo "| SigmaTau-Explorer-macos-15-intel | macOS Intel: .dmg, .zip, sigmatau CLI .tar.gz |"
          } >> "$GITHUB_STEP_SUMMARY"
