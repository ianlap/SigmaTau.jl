name: Explorer app

# Builds the desktop explorer into a standalone app folder with
# PackageCompiler (app/SigmaTauExplorer/build/build.jl), checks that the built
# launcher passes its --smoke self-test, and uploads the folder. Manual only:
# a build takes tens of minutes. Linux under xvfb only; GLMakie traced on a
# headless runner is a test build, and release builds come from a desktop.

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: '1'
      - uses: julia-actions/cache@v2
      - name: Install xvfb and Mesa
        run: sudo apt-get update && sudo apt-get install -y xvfb libgl1-mesa-dri
      - name: Build app
        run: |
          start=$(date +%s)
          xvfb-run -a -s "-screen 0 1600x1050x24" julia app/SigmaTauExplorer/build/build.jl
          echo "BUILD_MIN=$(( ($(date +%s) - start) / 60 ))" >> "$GITHUB_ENV"
      - name: Smoke-test the built app
        env:
          SIGMATAU_SMOKE_FIXTURE: ${{ github.workspace }}/test/fixtures/validation/stable32gen.DAT
          SIGMATAU_SMOKE_DIR: ${{ runner.temp }}/smoke
        run: |
          mkdir -p "$SIGMATAU_SMOKE_DIR"
          start=$(date +%s.%N)
          xvfb-run -a -s "-screen 0 1600x1050x24" app/SigmaTauExplorer/dist/SigmaTauExplorer/bin/sigmatau-explorer --smoke
          echo "SMOKE_S=$(echo "$(date +%s.%N) - $start" | bc)" >> "$GITHUB_ENV"
      - name: Package
        run: |
          tar -C app/SigmaTauExplorer/dist -czf SigmaTauExplorer-linux-x86_64.tar.gz SigmaTauExplorer
          {
            echo "### Explorer app (Linux, xvfb test build)"
            echo "| | |"
            echo "| --- | --- |"
            echo "| Build time | ${BUILD_MIN} min |"
            echo "| App folder | $(du -sh app/SigmaTauExplorer/dist/SigmaTauExplorer | cut -f1) |"
            echo "| Tarball | $(du -sh SigmaTauExplorer-linux-x86_64.tar.gz | cut -f1) |"
            echo "| --smoke run (launch to exit) | ${SMOKE_S} s |"
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: SigmaTauExplorer-linux-x86_64
          path: SigmaTauExplorer-linux-x86_64.tar.gz
          retention-days: 14
